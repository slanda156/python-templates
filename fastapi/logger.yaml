version: 1

formatters:
  simple:
    format: "%(levelname)8s - %(message)s"

  complex:
    format: "%(asctime)s %(levelname)8s:%(lineno)4d:%(name)s- %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: simple

  file:
    class: logging.FileHandler
    formatter: complex
    filename: "log.log"
    mode: w

root:
  level: DEBUG
  handlers: [console, file]

disable_existing_loggers: false
